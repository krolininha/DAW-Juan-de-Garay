<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejemplo de tabla sencilla</title>
</head>

<body>
    <h1>Listado de cursos</h1>
    <table border="1" cellpadding="10" cellspacing="0">
        <tr>
            <td><strong>Curso</strong></td>
            <td><strong>Horas</strong></td>
            <td><strong>Horario</strong></td>
        </tr>
        <tr>
            <td>CSS</td>
            <td>20</td>
            <td>16:00 - 20:00</td>
        </tr>
        <tr>
            <td>HTML</td>
            <td>20</td>
            <td>16:00 - 20:00</td>
        </tr>
        <tr>
            <td rowspan="2">Dreamweaver"</td>
            <td>60</td>
            <td>16:00 - 20:00</td>
        </tr>
        <tr>            
            <td>40</td>
            <td>16:00 - 20:00</td>
        </tr>
        <tr>
            <td>JavaScript</td>
            <td colspan="2">em andamento</td>
            
    </table>
</body>

</html>
